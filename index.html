<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Bir Sorum Var!</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffe6e6; /* Tatlı bir pembe arka plan */
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            overflow: hidden;
        }
        #container {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        h1 {
            color: #ff4d4d;
            font-size: 2.5em;
            margin-bottom: 30px;
            transition: 0.3s;
        }
        .buttons {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
        }
        button {
            padding: 10px 20px;
            font-size: 1.2em;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            transition: 0.2s;
            font-weight: bold;
        }
        #evetBtn {
            background-color: #4CAF50;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #evetBtn:hover {
            background-color: #45a049;
        }
        #hayirBtn {
            background-color: #f44336;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #hayirBtn:hover {
            background-color: #d32f2f;
        }
        .heart-container {
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .heart {
            color: #ff4d4d;
            font-size: 120px;
            animation: heartbeat 1s infinite alternate;
            margin-bottom: 20px;
        }
        .success-text {
            color: #ff4d4d;
            font-size: 2em;
            font-weight: bold;
        }
        @keyframes heartbeat {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }
    </style>
</head>
<body>

<div id="container">
    <h1 id="soru">Benimle çıkar mısın? 🥺</h1>
    <div class="buttons" id="butonlar">
        <button id="evetBtn" onclick="evet()">Evet</button>
        <button id="hayirBtn" onclick="hayir()">Hayır</button>
    </div>
    
    <div class="heart-container" id="kalpAnimasyonu">
        <div class="heart">❤️</div>
        <div class="success-text">Yaa, biliyordum! 😍</div>
    </div>
</div>

<script>
    // Hayır'a basıldıkça çıkacak esprili metinler
    const alternatifSorular = [
        "Emin misin?",
        "Bir daha düşün bence...",
        "Lütfen! 🥺",
        "Yapma böyle...",
        "Şansını zorluyorsun bak...",
        "Evet'e basmak o kadar zor olmamalı!",
        "İnat etme artık!",
        "Mecbur evet diyeceksin!"
    ];
    
    let soruIndex = 0;
    let evetBoyut = 1.2;

    function hayir() {
        // Soruyu sıradaki esprili metinle değiştir
        document.getElementById("soru").innerText = alternatifSorular[soruIndex];
        
        // Eğer dizinin sonuna gelindiyse son soruda kalsın diye kontrol
        if (soruIndex < alternatifSorular.length - 1) {
            soruIndex++;
        }

        // Evet butonunu her Hayır'a basıldığında biraz daha büyüt
        evetBoyut += 0.4;
        const evetBtn = document.getElementById("evetBtn");
        evetBtn.style.fontSize = evetBoyut + "em";
        evetBtn.style.padding = (evetBoyut * 8) + "px " + (evetBoyut * 15) + "px";
    }

    function evet() {
        // Butonları ve soruyu gizle, kalp animasyonunu göster
        document.getElementById("butonlar").style.display = "none";
        document.getElementById("soru").style.display = "none";
        
        const kalpAnimasyonu = document.getElementById("kalpAnimasyonu");
        kalpAnimasyonu.style.display = "flex";
    }
</script>

</body>
</html>
